name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Adresse GitHub Pages tant que joakimjanssens.com n'est pas branché.
      # Une fois le domaine configuré : SITE_URL=https://joakimjanssens.com, BASE_PATH=/ et public/CNAME.
      SITE_URL: https://joe-jns.github.io
      BASE_PATH: /joakimjanssens/
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          # Historique complet : la date « mis à jour le » vient du dernier commit du fichier En ce moment.
          fetch-depth: 0

      - name: Installer, construire et empaqueter le site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
